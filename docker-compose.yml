services:
  app:
    image: ${APP_IMAGE:-ghcr.io/wojciechpolak/glifestream:latest}
    restart: unless-stopped
    build: .
    volumes:
        - app_static:/app/static
        - ${RUN_DIR:-./run}:/app/run
        - ${RUN_DIR_MEDIA:-./run/media}:/app/media
        - nginx_templates:/app/nginx/templates
    environment:
        - VIRTUAL_HOST=${VIRTUAL_HOST:-}
        - VIRTUAL_PATH=${VIRTUAL_PATH:-/}
        # 1 behind a proxy that ends TLS, such as Cloudflare. See INSTALL.md.
        - SECURE_PROXY_SSL_HEADER=${SECURE_PROXY_SSL_HEADER:-0}
        - APP_SECRET_KEY
        - INITIAL_ADMIN_PASSWORD
        # Instead of the 'YOUR NAME' placeholder under the welcome entry.
        - FEED_AUTHOR_NAME=${FEED_AUTHOR_NAME:-gLifestream}
        # The themes to offer, such as default,riso, and the one to start
        # with. Unset, all the bundled ones, from 'default'. See INSTALL.md.
        - THEMES
        - DEFAULT_THEME
    # Nginx waits for this, so check early and often until the first success.
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost/"]
        interval: 60m
        timeout: 3s
        start_period: 5m
        start_interval: 2s
    depends_on:
        - memcached
  nginx:
      image: ${NGINX_IMAGE:-nginx:1.29}
      restart: unless-stopped
      volumes:
          - app_static:/app/static
          - ${RUN_DIR:-./run}:/app/run
          - ${RUN_DIR_MEDIA:-./run/media}:/app/media
          # The image's configuration, or a directory of your own templates.
          - ${NGINX_DIR_TEMPLATES:-nginx_templates}:/etc/nginx/templates
      ports:
          - "${APP_PORT:-8080}:80"
      environment:
          - VIRTUAL_HOST=${VIRTUAL_HOST:-_}
          - VIRTUAL_PATH=${VIRTUAL_PATH:-/}
      depends_on:
          app:
              condition: service_healthy
  memcached:
      image: ${MEMCACHED_IMAGE:-memcached:1.6}
      restart: unless-stopped
      entrypoint:
          - memcached
          - -m ${MEMCACHED_SIZE:-2}

volumes:
  app_static:
  nginx_templates:
