<?xml version="1.0" encoding="UTF-8"?>
<!--
  gLifestream app icon: logo.svg drawn full-bleed and opaque, with the
  mark inside the maskable safe zone (a circle of 40% radius). iOS and
  Android cut their own shape out of it. scripts/make-icons renders it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eeb044"/>
      <stop offset="1" stop-color="#c46a14"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#tile)"/>
  <g transform="translate(60 60) scale(0.88) translate(-61.75 -60)">
    <g fill="none" stroke="#fbf5ea" stroke-linecap="round">
      <path d="M24 32 C52 32 50 60 76 60" stroke-width="7" stroke-opacity="0.72"/>
      <path d="M24 88 C52 88 50 60 76 60" stroke-width="7" stroke-opacity="0.72"/>
      <path d="M24 60 H76" stroke-width="7" stroke-opacity="0.72"/>
      <path d="M66 60 H90" stroke-width="12"/>
    </g>
    <circle cx="92" cy="60" r="11" fill="#fbf5ea"/>
  </g>
</svg>
